<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Full bleed on purpose: macOS 26 and later crops app icons to its own
    rounded shape. An icon with its own rounded tile and transparent margin
    gets shrunk inside a white frame instead.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A8BF2"/>
      <stop offset="1" stop-color="#0062D1"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <!-- The mark from design/logo/inbox-zero.svg, centred on the tile. -->
  <g transform="translate(117 82) scale(8.2)">
    <path d="M56.23 27.63 A27 27 0 1 0 72.37 43.77" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <circle cx="73.2" cy="26.8" r="8" fill="#FFFFFF"/>
  </g>
</svg>
