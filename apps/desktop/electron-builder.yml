# Builds Productivity.app for this Mac only. No installer, no auto-update:
# `bun run install-app` copies the app into /Applications.
appId: com.marcoazzurrini.productivity
productName: Productivity
directories:
  output: release
# Vite bundles everything into out/, so the app needs no node_modules.
files:
  - out/**
  - package.json
npmRebuild: false
mac:
  target:
    - target: dir
      arch: arm64
  category: public.app-category.productivity
  # Ad-hoc signature: enough to run on the Mac that built it. The hardened
  # runtime only matters for Apple notarization, and with an ad-hoc
  # signature it can stop the app from launching.
  identity: "-"
  hardenedRuntime: false
